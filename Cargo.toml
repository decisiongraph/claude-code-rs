[package]
name = "claude-code-rs"
version = "0.1.1"
edition = "2021"
description = "Rust rewrite of the official Anthropic Claude Agent SDK (Python). Wraps Claude Code CLI via subprocess with bidirectional JSON streaming."
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/decisiongraph/claude-code-rs"
homepage = "https://github.com/decisiongraph/claude-code-rs"
keywords = ["claude", "anthropic", "agent", "sdk", "ai"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[features]
default = []
websocket = ["tokio-tungstenite", "futures-util"]

[dependencies]
tokio = { version = "1", features = ["process", "sync", "io-util", "macros", "rt-multi-thread", "time", "net"] }
tokio-stream = "0.1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.9"
which = "7"
semver = "1"
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
tempfile = "3"
